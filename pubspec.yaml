name: travary
description: "Travary - add your bookings and every day of your holiday organises itself."
publish_to: 'none'

version: 1.0.0+7

environment:
  sdk: ^3.10.1

dependencies:
  app_links: ^7.0.0
  archive: ^4.3.0
  cloud_firestore: ^6.10.0
  cloud_functions: ^6.5.0
  crypto: ^3.0.7
  file_picker: ^13.1.0
  firebase_analytics: ^12.6.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0
  firebase_messaging: ^16.7.0
  firebase_storage: ^13.6.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.0.0
  flutter_timezone: ^5.1.1
  google_fonts: ^8.2.1
  google_sign_in: ^7.2.0
  intl: ^0.20.3
  local_auth: ^3.0.2
  open_filex: ^4.7.0
  path: ^1.9.1
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  purchases_flutter: ^10.14.0
  qr_flutter: ^4.1.0
  receive_sharing_intent: 1.8.1
  share_plus: ^13.3.0
  timezone: ^0.11.0
  url_launcher: ^6.3.2
  video_player: ^2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Card artwork. Drop images into the folder for their booking kind; they are
  # discovered automatically. See assets/art/README.md for the naming rules.
  assets:
    - assets/onboarding/
    - assets/onboarding/travi/films/
    - assets/onboarding/travi/stills/
    - assets/onboarding/stages/
    - assets/travi/cameos/films/
    - assets/travi/cameos/stills/
    - assets/art/common/
    - assets/art/icons/
    - assets/art/flight/
    - assets/art/stay/
    - assets/art/attraction/
    - assets/art/dining/
    - assets/art/transport/
    - assets/art/activity/
    - assets/art/event/
    - assets/art/note/
    # The home-screen countdown widget's fonts (Source Serif 4 and Inter, SIL
    # Open Font License): byte for byte the files google_fonts downloads for
    # the app, copied to the widget so its tag reads the same. Named so
    # google_fonts never takes them for its own.
    - assets/widget/fonts/widget_serif_bold.ttf
    - assets/widget/fonts/widget_sans_semibold.ttf
    - assets/widget/fonts/widget_sans_medium.ttf
